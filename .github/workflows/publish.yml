name: Publish npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Checkout happens inside the serialized job, never at the triggering SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preserve current release tooling for tag recovery
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/auto-release.mjs scripts/verify-published.mjs scripts/update-market-index.mjs "$RUNNER_TEMP/release-tools/"
      - name: Verify and reserve release
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node "$RUNNER_TEMP/release-tools/auto-release.mjs" prepare
      - name: Publish reserved release and verify public package
        if: env.RELEASE_SKIPPED != 'true'
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node "$RUNNER_TEMP/release-tools/auto-release.mjs" publish
      - name: Update market and GitHub release
        if: env.RELEASE_SKIPPED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/release-tools/auto-release.mjs" finalize
